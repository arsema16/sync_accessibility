<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SYNC – an inclusive job search and application platform for people with disabilities.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="sync_accessibility">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SYNC – Accessible Jobs</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Skip-navigation link for keyboard / screen-reader users (NVDA, JAWS, etc.)
       Hidden visually until focused; moves focus into the Flutter canvas. -->
  <a href="#flutter-app"
     style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden"
     onfocus="this.style.cssText='position:fixed;top:8px;left:8px;z-index:9999;padding:8px 16px;background:#005f5a;color:#fff;border-radius:4px;font:bold 14px/1 sans-serif;text-decoration:none;width:auto;height:auto;overflow:visible'"
     onblur="this.style.cssText='position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden'">
    Skip to main content
  </a>
  <div id="flutter-app" role="main" aria-label="SYNC – Accessible Jobs">
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  </div>
</body>
</html>
